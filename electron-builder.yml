appId: io.github.badul13.calendar-widget
productName: 캘린더 위젯
copyright: © 2026

directories:
  output: release
  buildResources: resources

files:
  - out/**
  - package.json

# 트레이 아이콘은 asar 안에서 못 읽으므로 resources 폴더로 그대로 내보낸다
extraResources:
  - from: resources/tray.png
    to: tray.png
  # OFL 은 글꼴을 재배포할 때 라이선스 원문을 함께 제공하도록 요구한다
  - from: licenses
    to: licenses
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md

# koffi 는 네이티브 바이너리라 asar 에 묶으면 로드에 실패한다
asarUnpack:
  - '**/node_modules/koffi/**'

win:
  icon: resources/icon.png
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 캘린더 위젯
  # 깃허브 릴리즈는 파일 이름의 한글을 지워 버리므로 exe 이름만 영문으로 둔다
  artifactName: CalendarWidget-Setup-${version}.exe

portable:
  artifactName: CalendarWidget-portable-${version}.exe
